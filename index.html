<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu namorado não é seu</title>
<meta name="description" content="As peças que fizeram eu me apaixonar. Indicações da Lorena.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--burg:#6b1e2e;--cream:#fbf5ec;--soft:#ecd9d3;--gold:#c79a3b;--ink:#2b2226;--muted:#6f5d64}
@media (prefers-color-scheme:dark){:root{--cream:#241a1d;--soft:#3a2a2f;--ink:#f6ece4;--muted:#c9b6bb;--burg:#e9b7a9}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:400 16px/1.55 'Poppins',system-ui,sans-serif}
main{max-width:30rem;margin:0 auto;padding:0 1rem 3rem}
.hero{position:relative;margin:0 -1rem;height:min(78vh,34rem);overflow:hidden;background:#2b2226}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:60%;background:linear-gradient(to top,rgba(43,34,38,.96) 25%,rgba(43,34,38,0))}
.hero h1{position:absolute;z-index:1;left:1.25rem;right:1.25rem;bottom:1.5rem;margin:0;font:700 clamp(2rem,9vw,2.6rem)/1.08 'Lora',serif;color:#fbf5ec}
.hero h1 i{display:block;font-weight:500;color:var(--gold);font-size:.62em;margin-top:.5rem}
.lead{font:500 1.2rem/1.4 'Lora',serif;margin:1.6rem 0 .4rem;color:var(--burg)}
p{margin:.4rem 0 1rem}
.group{margin-top:2rem}
.group h2{font:700 1.25rem/1.2 'Lora',serif;color:var(--burg);margin:0 0 .5rem}
.card{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:3.5rem;padding:.9rem 1.1rem;margin:.6rem 0;background:var(--soft);border-left:4px solid var(--gold);border-radius:.4rem;color:var(--ink);text-decoration:none}
a.card:hover,a.card:focus-visible{outline:2px solid var(--burg);outline-offset:2px}
.card small{display:block;color:var(--muted);font-size:.8rem}
.soon{opacity:.7}
.tag{font-size:.8rem;color:var(--muted);white-space:nowrap}
.go{font-weight:600;color:var(--burg);white-space:nowrap}
.tk{display:block;margin-top:2.4rem;text-align:center;font-weight:600;color:var(--burg)}
</style>
</head>
<body>
<main>
<header class="hero">
  <img src="lorena.jpg" alt="Lorena sentada no café com a cachorra Zoe" width="720">
  <h1>Meu namorado não é seu<i>O segredo está aqui</i></h1>
</header>

<p class="lead">Quer saber como ele se veste?</p>
<p>Aqui estão as roupas, os acessórios e o perfume que fizeram eu me apaixonar por ele. Dá uma olhada, vai adorar.</p>

<div id="lista"></div>

<a class="tk" href="https://www.tiktok.com/@projeto_omze">Mais no TikTok @projeto_omze</a>
</main>

<script>
/* Para incluir um link: preencha "url" do item. Sem url, ele aparece como "em breve". */
const GRUPOS=[
 {titulo:"Roupas",itens:[
  {nome:"Polo escura",nota:"Look 1: encontro e trabalho",url:""},
  {nome:"Camiseta básica branca",nota:"Look 2: dia a dia",url:""},
  {nome:"Camisa social nude",nota:"Look 3: eventos",url:""}]},
 {titulo:"Acessórios",itens:[
  {nome:"Relógio analógico",nota:"O que mais chama atenção",url:""},
  {nome:"Cinto discreto",nota:"Combinando com o sapato",url:""}]},
 {titulo:"Perfume",itens:[
  {nome:"Perfume masculino",nota:"2 a 3 borrifadas",url:""}]}
];
const el=document.getElementById('lista');
GRUPOS.forEach(g=>{
 const s=document.createElement('section');s.className='group';
 const h=document.createElement('h2');h.textContent=g.titulo;s.appendChild(h);
 g.itens.forEach(i=>{
  const ok=!!i.url;
  const c=document.createElement(ok?'a':'div');
  c.className='card'+(ok?'':' soon');
  if(ok){c.href=i.url;c.target='_blank';c.rel='noopener'}
  c.innerHTML='<span>'+i.nome+'<small>'+i.nota+'</small></span><span class="'+(ok?'go':'tag')+'">'+(ok?'Ver na Shopee':'em breve')+'</span>';
  s.appendChild(c);
 });
 el.appendChild(s);
});
</script>
</body>
</html>
