<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu namorado não é seu</title>
<meta name="description" content="As peças que fizeram eu me apaixonar. Indicações da Lorena.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--burg:#6b1e2e;--cream:#fbf5ec;--soft:#ecd9d3;--gold:#c79a3b;--ink:#2b2226;--muted:#6f5d64}
@media (prefers-color-scheme:dark){:root{--cream:#241a1d;--soft:#3a2a2f;--ink:#f6ece4;--muted:#c9b6bb;--burg:#e9b7a9}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:400 16px/1.55 'Poppins',system-ui,sans-serif}
main{max-width:30rem;margin:0 auto;padding:0 1rem 3rem}
.hero{position:relative;margin:0 -1rem;height:min(78vh,34rem);overflow:hidden;background:#2b2226}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:60%;background:linear-gradient(to top,rgba(43,34,38,.96) 25%,rgba(43,34,38,0))}
.hero h1{position:absolute;z-index:1;left:1.25rem;right:1.25rem;bottom:1.5rem;margin:0;font:700 clamp(2.6rem,13vw,3.6rem)/1.05 'Lora',serif;color:#fbf5ec}
.hero h1 i{display:block;font-weight:500;color:var(--gold);font-size:.62em;margin-top:.5rem}
.lead{font:500 1.2rem/1.4 'Lora',serif;margin:1.6rem 0 .4rem;color:var(--burg)}
p{margin:.4rem 0 1rem}
.group{margin-top:2rem}
.group h2{font:700 1.25rem/1.2 'Lora',serif;color:var(--burg);margin:0 0 .5rem}
.card{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:3.5rem;padding:.9rem 1.1rem;margin:.6rem 0;background:var(--soft);border-left:4px solid var(--gold);border-radius:.4rem;color:var(--ink);text-decoration:none}
a.card:hover,a.card:focus-visible{outline:2px solid var(--burg);outline-offset:2px}
.card small{display:block;color:var(--muted);font-size:.8rem}
.soon{opacity:.7}
.th{width:4.4rem;height:4.4rem;border-radius:.4rem;object-fit:cover;flex:none}
.th+span{flex:1}
.tag{font-size:.8rem;color:var(--muted);white-space:nowrap}
.go{font-weight:600;color:var(--burg);white-space:nowrap}
.tk{display:block;margin-top:2.4rem;text-align:center;font-weight:600;color:var(--burg)}
</style>
</head>
<body>
<main>
<header class="hero">
  <img src="capa.jpg" alt="Lorena de vestido dourado com o dedo nos lábios" width="720">
  <h1>O segredo está aqui!</h1>
</header>

<p class="lead">O segredo do meu namorado está aqui. 😏</p>
<p>Aqui estão as roupas, os acessórios e o perfume dos meus vídeos, e o e-book com o tutorial. Dá uma olhada, vai adorar.</p>

<div id="lista"></div>

<a class="tk" href="https://www.tiktok.com/@projeto_omze">Mais no TikTok @projeto_omze</a>
</main>

<script>
/* Para incluir um link: preencha "url" do item. Sem url, ele aparece como "em breve". */
const GRUPOS=[
 {titulo:"O tutorial completo",itens:[
  {nome:"E-book: Meu namorado não é seu",nota:"24 páginas ilustradas, para ele ficar bonitão",url:"https://danilogti.gumroad.com/l/meu-namorado-nao-e-seu",rotulo:"Quero o e-book"}]},
 {titulo:"O look do Arthur",itens:[
  {nome:"Camiseta branca básica",nota:"Look 2: dia a dia",url:"https://s.shopee.com.br/9APt677G8Z",img:"img/camiseta.jpg"},
  {nome:"Calça jeans azul",nota:"Reta, azul médio",url:"https://s.shopee.com.br/80DvhyBhVM",img:"img/jeans.jpg"},
  {nome:"Sapatênis branco",nota:"Liso, solado baixo",url:"https://s.shopee.com.br/8AXLuHB4AP",img:"img/sapatenis.jpg"},
  {nome:"Cinto preto (kit)",nota:"Combinando com o sapato",url:"https://s.shopee.com.br/8Kqm6aAQpS",img:"img/cinto.jpg"},
  {nome:"Relógio Citizen Eco-Drive azul",nota:"Analógico, aço prateado",url:"https://droper.app/produto/1217460?utm_source=app&utm_medium=nativeshare&utm_campaign=share",rotulo:"Ver no Droper",img:"img/relogio.jpg"},
  {nome:"Perfume amadeirado",nota:"2 a 3 borrifadas",url:"https://s.shopee.com.br/6q1vIHbEmG",img:"img/perfume.jpg"}]},
 {titulo:"O look da Lorena",itens:[
  {nome:"Vestido dourado",nota:"O do vídeo",url:"https://s.shopee.com.br/5LD9FoQq9a",img:"img/vestido.jpg"},
  {nome:"Colar e brincos",nota:"Detalhes que valorizam",url:"https://s.shopee.com.br/80DrXbsgXb",img:"img/colar.jpg"},
  {nome:"Sandália",nota:"Salto alto",url:"https://s.shopee.com.br/2qVlOoL6lO",img:"img/sandalia.jpg"},
  {nome:"Kit de maquiagem completo Ruby Rose",nota:"Para o rosto inteiro",url:"https://s.shopee.com.br/7Aeog4hw8L",img:"img/maquiagem.jpg"},
  {nome:"Kit com 16 pincéis de maquiagem",nota:"Para aplicar tudo",url:"https://s.shopee.com.br/114BKh29l4"}]},
 {titulo:"Praia da Lorena",itens:[
  {nome:"Óculos de sol gatinho",nota:"Armação preta, lente degradê",url:"https://s.shopee.com.br/5AtmBh4Fs0",img:"img/oculos.jpg"},
  {nome:"Biquíni regulagem fio duplo",nota:"Vários modelos e cores",url:"https://s.shopee.com.br/70LQQgye0v",img:"img/biquini.jpg"}]},
 {titulo:"Os looks do vídeo da Lorena",aviso:"Peças parecidas com as do vídeo.",itens:[
  {nome:"Look de praia",nota:"Conjunto de camisa e short branco",url:"https://s.shopee.com.br/60SuMZpkFT",img:"img/praia.jpg"},
  {nome:"Look de noite",nota:"Vestido dourado",url:"https://s.shopee.com.br/5LD9FoQq9a",img:"img/vestido.jpg"},
  {nome:"Look de academia",nota:"Conjunto de top e short",url:"https://s.shopee.com.br/4B1GBl9O5G",img:"img/fitness.jpg"},
  {nome:"Look de café",nota:"Suéter de tricô",url:"https://s.shopee.com.br/4LKgOMVrpp",img:"img/cafe.jpg"}]}
];
const el=document.getElementById('lista');
GRUPOS.forEach(g=>{
 const s=document.createElement('section');s.className='group';
 const h=document.createElement('h2');h.textContent=g.titulo;s.appendChild(h);
 if(g.aviso){const n=document.createElement('p');n.className='tag';n.style.whiteSpace='normal';n.textContent=g.aviso;s.appendChild(n);}
 g.itens.forEach(i=>{
  const ok=!!i.url;
  const c=document.createElement(ok?'a':'div');
  c.className='card'+(ok?'':' soon');
  if(ok){c.href=i.url;c.target='_blank';c.rel='noopener'}
  c.innerHTML=(i.img?'<img class="th" src="'+i.img+'" alt="" loading="lazy">':'')+'<span>'+i.nome+'<small>'+i.nota+'</small></span><span class="'+(ok?'go':'tag')+'">'+(ok?(i.rotulo||'Ver na Shopee'):'em breve')+'</span>';
  s.appendChild(c);
 });
 el.appendChild(s);
});
</script>
</body>
</html>
